<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E7E9E5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141618" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Шкаф">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Шкаф и образы</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#E7E9E5; --surface:#FCFCFB; --surface-2:#F1F2EE; --canvas:#FFFFFF;
  --ink:#1B1E22; --ink-2:#4A5157; --muted:#7E868B;
  --line:#D3D6D0; --line-2:#C2C6BE;
  --accent:#33586B; --accent-soft:#DCE5E9; --on-accent:#FBFCFB;
  --brass:#9C6D33; --brass-soft:#F0E4D2; --warn:#8A5A22;
  --shadow:0 1px 2px rgba(27,30,34,.06),0 8px 24px -12px rgba(27,30,34,.18);
  --r:10px; --rs:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#141618; --surface:#1D2124; --surface-2:#252A2D; --canvas:#F7F7F5;
    --ink:#E7E8E4; --ink-2:#B3B9BC; --muted:#868D91;
    --line:#31373A; --line-2:#414849;
    --accent:#7FA9BE; --accent-soft:#22343D; --on-accent:#11171A;
    --brass:#CB9A5F; --brass-soft:#33291B; --warn:#C9954F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#141618; --surface:#1D2124; --surface-2:#252A2D; --canvas:#F7F7F5;
  --ink:#E7E8E4; --ink-2:#B3B9BC; --muted:#868D91;
  --line:#31373A; --line-2:#414849;
  --accent:#7FA9BE; --accent-soft:#22343D; --on-accent:#11171A;
  --brass:#CB9A5F; --brass-soft:#33291B; --warn:#C9954F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);
  font-family:"Golos Text","Segoe UI",system-ui,sans-serif;
  font-size:15px;line-height:1.45;margin:0;padding:0 0 76px;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

header{padding:16px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.tag{display:inline-flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--line);border-left:3px solid var(--brass);
  border-radius:0 var(--rs) var(--rs) 0;padding:5px 11px 5px 9px}
.tag .h{font-family:Oswald,"Golos Text",sans-serif;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;font-size:12px;color:var(--ink)}
.tag .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

h2{font-family:Oswald,"Golos Text",sans-serif;font-weight:500;letter-spacing:.1em;
  text-transform:uppercase;font-size:12.5px;color:var(--ink-2);margin:0 0 9px;text-wrap:balance}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0;line-height:1.4}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13.5px;background:var(--surface);color:var(--ink-2);
  border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer;
  transition:background .12s,border-color .12s,color .12s}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);
  color:var(--on-accent);font-weight:600}
.chip:focus-visible,button:focus-visible,label:focus-within{outline:2px solid var(--brass);outline-offset:2px}

.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;padding:3px;margin:0 0 14px}
.seg button{flex:1;font:inherit;font-size:14px;font-weight:500;border:0;background:none;
  color:var(--ink-2);padding:8px 6px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);
  box-shadow:0 1px 3px rgba(27,30,34,.14);font-weight:600}

.btn{font:inherit;font-weight:600;font-size:15px;border-radius:var(--rs);cursor:pointer;
  padding:12px 16px;border:1px solid var(--accent);background:var(--accent);
  color:var(--on-accent);width:100%;transition:filter .12s}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn.small{width:auto;padding:9px 14px;font-size:14px}
.row{display:flex;gap:8px;margin-top:10px}
.row .btn{flex:1}

/* --- коллаж образа --- */
.canvas{position:relative;width:100%;aspect-ratio:3/4;background:var(--canvas);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:2px}
.canvas img{position:absolute;display:block}
.canvas .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#8E9499;font-size:13.5px;text-align:center;padding:0 30px;line-height:1.5}

/* --- слоты ручной сборки --- */
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.slot{position:relative;border:1px solid var(--line);border-radius:var(--rs);
  background:var(--surface);aspect-ratio:3/4;cursor:pointer;padding:0;overflow:hidden;display:block}
.slot img{width:100%;height:100%;object-fit:contain;background:var(--canvas);display:block}
.slot .cap{position:absolute;left:0;right:0;bottom:0;font-family:Oswald,"Golos Text",sans-serif;
  font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  background:var(--surface);padding:2px 1px;text-align:center;border-top:1px solid var(--line)}
.slot.filled{border-color:var(--accent)}
.slot .plus{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--line-2);font-size:20px;line-height:1}

.legend{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:12px}
.legend div{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.legend .k{font-family:Oswald,"Golos Text",sans-serif;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}
.sw{width:11px;height:11px;border-radius:50%;border:1px solid var(--line-2);display:inline-block}

.note{margin-top:10px;font-size:13px;padding:9px 12px;border-radius:var(--rs);
  background:var(--brass-soft);color:var(--warn);border:1px solid var(--line)}
.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r);
  padding:18px 14px;text-align:center;color:var(--ink-2);font-size:14px;margin-top:10px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.cell{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  background:var(--canvas);padding:0;cursor:pointer;aspect-ratio:3/4;display:block}
.cell img{width:100%;height:100%;object-fit:contain;display:block}
.cell .lbl{position:absolute;left:0;right:0;bottom:0;
  background:linear-gradient(transparent,rgba(15,17,19,.78));
  color:#F3F4F1;font-family:Oswald,"Golos Text",sans-serif;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;padding:14px 6px 5px;text-align:left}
.cell.is-demo::after{content:"пример";position:absolute;top:5px;right:5px;background:var(--brass);
  color:#FFF;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 6px;border-radius:999px;font-family:Oswald,"Golos Text",sans-serif}

.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-top:10px}
.strip .mini{flex:0 0 84px;border:1px solid var(--line);border-radius:var(--rs);
  background:var(--canvas);aspect-ratio:3/4;position:relative;cursor:pointer;padding:0;overflow:hidden}
.strip .mini img{position:absolute}

.day{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:8px 10px;margin-top:8px}
.day .d{font-family:Oswald,"Golos Text",sans-serif;font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);width:52px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.day .th{display:flex;gap:4px;flex:1;min-width:0}
.day .th img{width:34px;height:42px;object-fit:contain;background:var(--canvas);
  border-radius:4px;border:1px solid var(--line)}
.day .oc{font-size:12.5px;color:var(--ink-2);flex:0 0 auto}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);
  border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;font:inherit;background:none;border:0;padding:11px 4px 12px;cursor:pointer;
  color:var(--muted);font-family:Oswald,"Golos Text",sans-serif;font-size:12px;letter-spacing:.11em;
  text-transform:uppercase;border-top:2px solid transparent;margin-top:-1px}
nav button[aria-current="page"]{color:var(--ink);border-top-color:var(--brass)}

.sheet{position:fixed;inset:0;background:rgba(12,14,16,.55);z-index:40;
  display:flex;align-items:flex-end;justify-content:center}
.sheet .inner{background:var(--ground);width:100%;max-width:560px;max-height:92vh;overflow:auto;
  border-radius:14px 14px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{font-family:Oswald,"Golos Text",sans-serif;font-weight:500;letter-spacing:.1em;
  text-transform:uppercase;font-size:13px;margin:0 0 12px;color:var(--ink-2)}
.field{margin-bottom:12px}
.field > span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.preview{width:100%;height:220px;object-fit:contain;border-radius:var(--r);
  background:var(--canvas);border:1px solid var(--line);margin-bottom:12px;display:block}
.txt{width:100%;font:inherit;padding:10px;border-radius:6px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink)}
.danger{color:#A03A2E;border-color:#C99A93;background:var(--surface)}
:root[data-theme="dark"] .danger{color:#E4948A;border-color:#5A3C38}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .danger{color:#E4948A;border-color:#5A3C38}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="tag"><span class="h">Шкаф и образы</span><span class="n" id="count">0</span></div>
  </header>

  <section id="v-look">
    <div class="seg" id="mode">
      <button type="button" data-m="auto" aria-pressed="true">Подобрать</button>
      <button type="button" data-m="hand" aria-pressed="false">Собрать самому</button>
    </div>

    <div id="autoBox">
      <h2>Куда собираешься</h2>
      <div class="chips" id="occ"></div>
      <h2 style="margin-top:14px">Что на улице</h2>
      <div class="chips" id="temp"></div>
      <div class="row"><button class="btn" id="make">Собрать образ</button></div>
    </div>

    <div class="canvas" id="canvas"></div>
    <div class="slots" id="slots"></div>
    <div id="lookMeta"></div>
    <div id="lookActions"></div>
  </section>

  <section id="v-closet" hidden>
    <h2>Что в шкафу</h2>
    <div class="chips" id="filter"></div>
    <div class="row">
      <label class="btn" style="text-align:center" tabindex="0">Добавить фото
        <input type="file" id="pick" accept="image/*" multiple hidden>
      </label>
    </div>
    <div class="grid" id="grid"></div>
    <p class="hint" id="closetHint"></p>
    <div id="demoBox" style="margin-top:10px"></div>
  </section>

  <section id="v-days" hidden>
    <h2>Сохранённые образы</h2>
    <div id="saved"></div>
    <h2 style="margin-top:18px">Что носил</h2>
    <div id="days"></div>
  </section>
</div>

<nav>
  <button data-v="look" aria-current="page">Образ</button>
  <button data-v="closet">Шкаф</button>
  <button data-v="days">Дни</button>
</nav>

<script>
(function(){
"use strict";

/* ---------- хранилище ---------- */
var DB=null;
function db(){return new Promise(function(res,rej){
  if(DB) return res(DB);
  var r=indexedDB.open("wardrobe",2);
  r.onupgradeneeded=function(e){var d=e.target.result;
    if(!d.objectStoreNames.contains("items")) d.createObjectStore("items",{keyPath:"id"});
    if(!d.objectStoreNames.contains("wears")) d.createObjectStore("wears",{keyPath:"id"});
    if(!d.objectStoreNames.contains("looks")) d.createObjectStore("looks",{keyPath:"id"});};
  r.onsuccess=function(){DB=r.result;res(DB)};
  r.onerror=function(){rej(r.error)};});}
function tx(store,mode,fn){return db().then(function(d){return new Promise(function(res,rej){
  var t=d.transaction(store,mode),s=t.objectStore(store),out=fn(s);
  t.oncomplete=function(){res(out&&out.result!==undefined?out.result:out)};
  t.onerror=function(){rej(t.error)};});});}
var all=function(s){return tx(s,"readonly",function(o){return o.getAll()})};
var put=function(s,v){return tx(s,"readwrite",function(o){return o.put(v)})};
var del=function(s,k){return tx(s,"readwrite",function(o){return o.delete(k)})};

/* ---------- справочники ---------- */
var CATS=[["outer","Верхняя"],["top","Верх"],["bottom","Низ"],["shoes","Обувь"],["acc","Аксессуар"]];
var FORMAL=[["home","Дома"],["casual","Повседневное"],["smart","Наряднее"],["business","Деловое"]];
var SEASON=[["warm","Тепло"],["mid","Межсезонье"],["cold","Холод"],["all","Всесезон"]];
var OCC=[
 {k:"home",t:"Дома",f:["home","casual"]},
 {k:"walk",t:"Погулять",f:["casual","smart"]},
 {k:"work",t:"Деловая встреча",f:["business","smart"]},
 {k:"evening",t:"Вечер",f:["smart","business"]},
 {k:"sport",t:"Спорт",f:["home","casual"]}];
var TEMP=[
 {k:"hot",t:"Жарко",s:["warm","all"],outer:false},
 {k:"warm",t:"Тепло",s:["warm","mid","all"],outer:false},
 {k:"cool",t:"Прохладно",s:["mid","cold","all"],outer:true},
 {k:"cold",t:"Холодно",s:["cold","all"],outer:true}];
var label=function(list,k){for(var i=0;i<list.length;i++) if(list[i][0]===k) return list[i][1];return k;};

/* раскладка коллажа: как в каталогах, вещи лежат по месту на фигуре */
var LAY={outer:{w:50,cx:25,z:2},top:{w:46,cx:50,z:3},bottom:{w:42,cx:47,z:1},
         shoes:{w:34,cx:71,z:4},acc:{w:26,cx:81,z:5}};
var AR={};   /* id -> ширина/высота картинки, считается один раз */

/* ---------- цвет ---------- */
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),h=0,s=0,l=(mx+mn)/2,d=mx-mn;
  if(d){s=l>.5?d/(2-mx-mn):d/(mx+mn);
    h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);h*=60;}
  return{h:h,s:s,l:l};}
function colorName(c){
  if(c.l<.13) return "чёрный";
  if(c.l>.88&&c.s<.16) return "белый";
  if(c.s<.14) return c.l<.42?"тёмно-серый":"серый";
  var h=c.h;
  if(h<18||h>=340) return c.l<.34?"бордовый":"красный";
  if(h<45) return c.s<.42?(c.l>.55?"песочный":"бежевый"):(c.l<.38?"коричневый":"оранжевый");
  if(h<68) return c.l<.42?"хаки":"жёлтый";
  if(h<160) return c.l<.36?"тёмно-зелёный":(c.s<.35?"оливковый":"зелёный");
  if(h<200) return "бирюзовый";
  if(h<250) return c.l<.34?"тёмно-синий":(c.s<.4?"джинсовый":"синий");
  if(h<290) return "фиолетовый";
  return "розовый";}
function isNeutral(c){
  if(c.s<.19||c.l<.16||c.l>.86) return true;
  if(c.h>=18&&c.h<48&&c.s<.4) return true;
  if(c.h>=200&&c.h<250&&c.l<.34) return true;
  return false;}
function mkColor(o){return{h:o.h,s:o.s,l:o.l,name:colorName(o),neutral:isNeutral(o),
  css:"hsl("+Math.round(o.h)+","+Math.round(o.s*100)+"%,"+Math.round(o.l*100)+"%)"};}

/* ---------- фото: сжатие, вырезание фона, обрезка полей ---------- */
function readImage(file){return new Promise(function(res,rej){
  var fr=new FileReader();
  fr.onload=function(){var im=new Image();im.onload=function(){res(im)};im.onerror=rej;im.src=fr.result;};
  fr.onerror=rej;fr.readAsDataURL(file);});}

function toCanvas(im,max){
  var w=im.width,h=im.height,k=Math.min(1,max/Math.max(w,h));
  var c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);return c;}

function dist(a,b){var dr=a[0]-b[0],dg=a[1]-b[1],db=a[2]-b[2];
  return Math.sqrt(dr*dr+dg*dg+db*db);}

/* заливка от краёв: убирает ровный фон студийного снимка. Возвращает null, если фон пёстрый */
function cutBg(c){
  var x=c.getContext("2d"),W=c.width,H=c.height,d=x.getImageData(0,0,W,H),p=d.data;
  var px=function(i){return [p[i*4],p[i*4+1],p[i*4+2]]};
  var corners=[0,W-1,(H-1)*W,(H-1)*W+W-1].map(px),far=0;
  for(var a=0;a<4;a++) for(var b=a+1;b<4;b++) far=Math.max(far,dist(corners[a],corners[b]));
  if(far>52) return null;
  var bg=corners[0],TH=46,seen=new Uint8Array(W*H),stack=new Int32Array(W*H),sp=0,cut=0;
  for(var i=0;i<W;i++){stack[sp++]=i;stack[sp++]=(H-1)*W+i;}
  for(var j=0;j<H;j++){stack[sp++]=j*W;stack[sp++]=j*W+W-1;}
  while(sp>0){
    var idx=stack[--sp];
    if(idx<0||idx>=W*H||seen[idx]) continue;
    if(dist(px(idx),bg)>TH) continue;
    seen[idx]=1;p[idx*4+3]=0;cut++;
    var cx=idx%W;
    if(cx>0&&sp<stack.length-4) stack[sp++]=idx-1;
    if(cx<W-1&&sp<stack.length-4) stack[sp++]=idx+1;
    if(idx>=W&&sp<stack.length-4) stack[sp++]=idx-W;
    if(idx<(H-1)*W&&sp<stack.length-4) stack[sp++]=idx+W;}
  if(cut<W*H*0.06) return null;            /* почти ничего не убралось */
  if(cut>W*H*0.97) return null;            /* убралось всё, значит промах */
  x.putImageData(d,0,0);
  return trim(c);}

function trim(c){
  var x=c.getContext("2d"),W=c.width,H=c.height,p=x.getImageData(0,0,W,H).data;
  var x0=W,y0=H,x1=0,y1=0,found=false;
  for(var y=0;y<H;y++) for(var xx=0;xx<W;xx++){
    if(p[(y*W+xx)*4+3]>12){found=true;
      if(xx<x0)x0=xx; if(xx>x1)x1=xx; if(y<y0)y0=y; if(y>y1)y1=y;}}
  if(!found) return c;
  var pad=Math.round(Math.max(x1-x0,y1-y0)*0.02);
  x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);
  x1=Math.min(W-1,x1+pad);y1=Math.min(H-1,y1+pad);
  var o=document.createElement("canvas");o.width=x1-x0+1;o.height=y1-y0+1;
  o.getContext("2d").drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);
  return o;}

function pngURL(c){
  try{var w=c.toDataURL("image/webp",.88);
    if(w.indexOf("data:image/webp")===0) return w;}catch(e){}
  return c.toDataURL("image/png");}

function avgColor(c){
  var x=c.getContext("2d"),W=c.width,H=c.height,
      sx=Math.round(W*.25),sy=Math.round(H*.25),
      sw=Math.max(1,Math.round(W*.5)),sh=Math.max(1,Math.round(H*.5));
  var d=x.getImageData(sx,sy,sw,sh).data,r=0,g=0,b=0,n=0;
  for(var i=0;i<d.length;i+=16){if(d[i+3]<40) continue;r+=d[i];g+=d[i+1];b+=d[i+2];n++;}
  if(!n) return mkColor(rgb2hsl(128,128,128));
  return mkColor(rgb2hsl(r/n,g/n,b/n));}

function measure(pieces){
  return Promise.all(pieces.map(function(it){
    if(AR[it.id]) return Promise.resolve();
    return new Promise(function(res){
      var im=new Image();
      im.onload=function(){AR[it.id]=im.naturalWidth/(im.naturalHeight||1);res()};
      im.onerror=function(){AR[it.id]=0.75;res()};
      im.src=art(it);});}));}

/* складывает вещи в фигуру: верх, под ним низ внахлёст, снизу обувь */
function layout(pieces){
  var by={};pieces.forEach(function(it){by[it.cat]=it});
  var HH=400/3, ar=function(it){return AR[it.id]||0.75};
  var h={},col=["top","bottom","shoes"];
  col.forEach(function(c){if(by[c]) h[c]=LAY[c].w/ar(by[c]);});
  var OV=7, OVS=5;
  var total=(h.top||0)+(h.bottom||0)+(h.shoes||0)
    -((h.top&&h.bottom)?OV:0)-((h.bottom&&h.shoes)?OVS:0);
  var y0=5, avail=HH-y0-4, k=total>avail?avail/total:1;
  var out=[],y=y0;
  col.forEach(function(c){
    if(!by[c]) return;
    var w=LAY[c].w*k, hh=h[c]*k;
    out.push({it:by[c],l:LAY[c].cx-w/2,t:y,w:w,h:hh,z:LAY[c].z});
    y+=hh-(c==="top"?OV*k:(c==="bottom"?OVS*k:0));});
  var topBox=out.filter(function(o){return o.it.cat==="top"})[0];
  ["outer","acc"].forEach(function(c){
    if(!by[c]) return;
    var w=LAY[c].w*k, hh=w/ar(by[c]);
    var t=topBox?(c==="outer"?topBox.t-1:topBox.t+topBox.h*0.35):y0;
    if(t+hh>HH-2) t=Math.max(1,HH-2-hh);
    out.push({it:by[c],l:LAY[c].cx-w/2,t:t,w:w,h:hh,z:LAY[c].z});});
  return out;}

    im.style.left=b.l+"%";im.style.width=b.w+"%";
    im.style.top=(b.t*0.75)+"%";im.style.height=(b.h*0.75)+"%";
    im.style.objectFit="contain";im.style.zIndex=b.z;
    host.appendChild(im);});}

/* ---------- подбор ---------- */
function recent(id){
  var lim=Date.now()-7*864e5,n=0;
  wears.forEach(function(w){
    if(new Date(w.date).getTime()>=lim && w.items.indexOf(id)>-1) n++;});
  return n;}

function build(){
  var o=OCC.filter(function(x){return x.k===occ})[0],
      t=TEMP.filter(function(x){return x.k===temp})[0];
  var pool=function(cat){return items.filter(function(i){
    return i.cat===cat && o.f.indexOf(i.formal)>-1 && t.s.indexOf(i.season)>-1;});};
  var need=["top","bottom","shoes"].concat(t.outer?["outer"]:[]);
  var pools={},missing=[];
  need.forEach(function(c){pools[c]=pool(c);if(!pools[c].length) missing.push(label(CATS,c).toLowerCase());});
  if(missing.length){
    current={error:"Не хватает вещей: "+missing.join(", ")+
      ". Добавь их в шкаф или смени повод и погоду."};
    renderLook();return;}
  var best=null,bestScore=1e9;
  for(var k=0;k<220;k++){
    var set=need.map(function(c){var p=pools[c];return p[Math.floor(Math.random()*p.length)]});
    var bright=set.filter(function(i){return !i.color.neutral}),clash=false;
    if(bright.length>2) clash=true;
    else if(bright.length===2){
      var dh=Math.abs(bright[0].color.h-bright[1].color.h);dh=Math.min(dh,360-dh);
      if(dh>42) clash=true;}
    var score=set.reduce(function(a,i){return a+recent(i.id)*3},0)+(clash?40:0)+Math.random();
    if(score<bestScore){bestScore=score;best={pieces:set,clash:clash};}
    if(!clash&&bestScore<1) break;}
  /* аксессуар кладём, если он есть и подходит по поводу */
  var acc=pool("acc");
  if(acc.length) best.pieces=best.pieces.concat([acc[Math.floor(Math.random()*acc.length)]]);
  current={pieces:best.pieces,
    note:best.clash?"Ярких вещей больше, чем стоит носить вместе. Других сочетаний под этот повод в шкафу не нашлось.":""};
  renderLook();}

  var files=Array.prototype.slice.call(e.target.files||[]);
  e.target.value="";
  if(!files.length) return;
  var hint=$("#closetHint");
  hint.textContent="Обрабатываю "+files.length+" фото…";
  var added=[];
  files.reduce(function(chain,f){
    return chain.then(function(){
      return readImage(f).then(function(im){
        var r=process(im);
        var it={id:"i"+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
                img:r.img,cut:r.cut,cat:guessCat(f.name),formal:"casual",season:"all",
                color:r.color,name:"",added:Date.now()};
        items.push(it);added.push(it);
        return put("items",it);
      }).catch(function(){});});
  },Promise.resolve()).then(function(){
    return added.length?dropDemo(true):null;
  }).then(function(){
    renderAll();
    if(added.length===1) openItem(added[0]);
    else hint.textContent="Добавлено "+added.length+". Открой каждую и поставь метки: без них подбор работает вслепую.";});});

function guessCat(n){
  n=(n||"").toLowerCase();
  if(/shoe|boot|sneak|обув|ботин|кросс|туфл|кед/.test(n)) return "shoes";
  if(/jean|pant|trous|брюк|джинс|штан|шорт/.test(n)) return "bottom";
  if(/coat|jack|курт|пальто|пуховик|тренч/.test(n)) return "outer";
  if(/bag|watch|сумк|часы|ремен|шапк|шарф/.test(n)) return "acc";
  return "top";}

function dropDemo(quiet){
  var demo=items.filter(function(i){return i.demo});
  if(!demo.length) return Promise.resolve();
  items=items.filter(function(i){return !i.demo});
  Object.keys(hand).forEach(function(k){if(hand[k].demo) delete hand[k]});
  current=null;
  var p=Promise.all(demo.map(function(i){return del("items",i.id)}));
  return quiet?p:p.then(renderAll);}

/* ---------- навигация ---------- */
function go(v){
  view=v;
  ["look","closet","days"].forEach(function(x){$("#v-"+x).hidden=(x!==v);});
  Array.prototype.forEach.call(document.querySelectorAll("nav button"),function(b){
    if(b.dataset.v===v) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");});
  renderAll();window.scrollTo(0,0);}
Array.prototype.forEach.call(document.querySelectorAll("nav button"),function(b){
  b.onclick=function(){go(b.dataset.v)};});
Array.prototype.forEach.call(document.querySelectorAll("#mode button"),function(b){
  b.onclick=function(){mode=b.dataset.m;renderLook();};});
$("#make").onclick=build;
document.querySelector('label[tabindex]').addEventListener("keydown",function(e){
  if(e.key==="Enter"||e.key===" "){e.preventDefault();$("#pick").click();}});

function renderHeader(){
  var real=items.filter(function(i){return !i.demo}).length,d=items.length-real;
  $("#count").textContent=real+" "+plural(real,"вещь","вещи","вещей")+(d?" + "+d+" примеров":"");}
function renderAll(){renderHeader();
  if(view==="look") renderLook(); else if(view==="closet") renderCloset(); else renderDays();}

Promise.all([all("items"),all("wears"),all("looks")]).then(function(r){
  items=r[0]||[];wears=r[1]||[];looks=r[2]||[];
  if(!items.length){items=demoItems();
    return Promise.all(items.map(function(i){return put("items",i)}));}
}).catch(function(){items=demoItems();})
  .then(function(){build();go("look");});
})();
</script>
