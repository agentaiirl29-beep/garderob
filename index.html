<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E7E9E5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141618" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Шкаф">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Шкаф и образы</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#E7E9E5; --surface:#FCFCFB; --surface-2:#F1F2EE;
  --ink:#1B1E22; --ink-2:#4A5157; --muted:#7E868B;
  --line:#D3D6D0; --line-2:#C2C6BE;
  --accent:#33586B; --accent-soft:#DCE5E9; --on-accent:#FBFCFB;
  --brass:#9C6D33; --brass-soft:#F0E4D2;
  --ok:#3F6B4A; --warn:#8A5A22;
  --shadow:0 1px 2px rgba(27,30,34,.06),0 8px 24px -12px rgba(27,30,34,.18);
  --r:10px; --rs:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#141618; --surface:#1D2124; --surface-2:#252A2D;
    --ink:#E7E8E4; --ink-2:#B3B9BC; --muted:#868D91;
    --line:#31373A; --line-2:#414849;
    --accent:#7FA9BE; --accent-soft:#22343D; --on-accent:#11171A;
    --brass:#CB9A5F; --brass-soft:#33291B;
    --ok:#7FAE8A; --warn:#C9954F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#141618; --surface:#1D2124; --surface-2:#252A2D;
  --ink:#E7E8E4; --ink-2:#B3B9BC; --muted:#868D91;
  --line:#31373A; --line-2:#414849;
  --accent:#7FA9BE; --accent-soft:#22343D; --on-accent:#11171A;
  --brass:#CB9A5F; --brass-soft:#33291B;
  --ok:#7FAE8A; --warn:#C9954F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);
  font-family:"Golos Text","Segoe UI",system-ui,sans-serif;
  font-size:15px;line-height:1.45;margin:0;padding:0 0 76px;
  -webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* --- шапка: ярлык, как на одежде --- */
header{padding:16px 0 10px}
.tag{display:inline-flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--line);border-left:3px solid var(--brass);
  border-radius:0 var(--rs) var(--rs) 0;padding:5px 11px 5px 9px}
.tag .h{font-family:Oswald,"Golos Text",sans-serif;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;font-size:12px;color:var(--ink)}
.tag .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

h2{font-family:Oswald,"Golos Text",sans-serif;font-weight:500;letter-spacing:.1em;
  text-transform:uppercase;font-size:12.5px;color:var(--ink-2);margin:0 0 9px;text-wrap:balance}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0;line-height:1.4}

/* --- чипы --- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13.5px;background:var(--surface);color:var(--ink-2);
  border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer;
  transition:background .12s,border-color .12s,color .12s}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.chip:focus-visible,button:focus-visible,label:focus-within{outline:2px solid var(--brass);outline-offset:2px}

/* --- кнопки --- */
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:var(--rs);cursor:pointer;
  padding:12px 16px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);
  width:100%;transition:filter .12s}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn.small{width:auto;padding:9px 14px;font-size:14px}
.row{display:flex;gap:8px;margin-top:10px}
.row .btn{flex:1}

/* --- образ --- */
.look{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.piece{display:flex;align-items:center;gap:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:9px;box-shadow:var(--shadow)}
.piece img{width:64px;height:64px;object-fit:cover;border-radius:var(--rs);
  background:var(--surface-2);flex:0 0 auto}
.piece .meta{min-width:0;flex:1}
.piece .role{font-family:Oswald,"Golos Text",sans-serif;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
.piece .name{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.piece .sub{font-size:12.5px;color:var(--ink-2)}
.sw{width:11px;height:11px;border-radius:50%;border:1px solid var(--line-2);
  display:inline-block;vertical-align:-1px;margin-right:5px}

.note{margin-top:10px;font-size:13px;padding:9px 12px;border-radius:var(--rs);
  background:var(--brass-soft);color:var(--warn);border:1px solid var(--line)}
.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r);
  padding:18px 14px;text-align:center;color:var(--ink-2);font-size:14px}

/* --- сетка шкафа --- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.cell{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  background:var(--surface);padding:0;cursor:pointer;aspect-ratio:3/4;display:block}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell .lbl{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(15,17,19,.82));
  color:#F3F4F1;font-family:Oswald,"Golos Text",sans-serif;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;padding:14px 6px 5px;text-align:left}
.cell.is-demo::after{content:"пример";position:absolute;top:5px;right:5px;background:var(--brass);
  color:#FFF;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 6px;border-radius:999px;font-family:Oswald,"Golos Text",sans-serif}

/* --- дни --- */
.day{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:8px 10px;margin-top:8px}
.day .d{font-family:Oswald,"Golos Text",sans-serif;font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);width:62px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.day .th{display:flex;gap:4px;flex:1;min-width:0}
.day .th img{width:36px;height:44px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.day .oc{font-size:12.5px;color:var(--ink-2);flex:0 0 auto}

/* --- нижняя навигация --- */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);
  border-top:1px solid var(--line);display:flex;z-index:20;
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;font:inherit;background:none;border:0;padding:11px 4px 12px;cursor:pointer;
  color:var(--muted);font-family:Oswald,"Golos Text",sans-serif;font-size:12px;letter-spacing:.11em;
  text-transform:uppercase;border-top:2px solid transparent;margin-top:-1px}
nav button[aria-current="page"]{color:var(--ink);border-top-color:var(--brass)}

/* --- модальное окно --- */
.sheet{position:fixed;inset:0;background:rgba(12,14,16,.55);z-index:40;
  display:flex;align-items:flex-end;justify-content:center}
.sheet .inner{background:var(--ground);width:100%;max-width:560px;max-height:92vh;overflow:auto;
  border-radius:14px 14px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{font-family:Oswald,"Golos Text",sans-serif;font-weight:500;letter-spacing:.1em;
  text-transform:uppercase;font-size:13px;margin:0 0 12px;color:var(--ink-2)}
.field{margin-bottom:12px}
.field > span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.preview{width:100%;max-height:230px;object-fit:contain;border-radius:var(--r);
  background:var(--surface-2);border:1px solid var(--line);margin-bottom:12px}
.danger{color:#A03A2E;border-color:#C99A93;background:var(--surface)}
:root[data-theme="dark"] .danger{color:#E4948A;border-color:#5A3C38}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .danger{color:#E4948A;border-color:#5A3C38}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="tag"><span class="h">Шкаф и образы</span><span class="n" id="count">0 вещей</span></div>
  </header>

  <!-- ОБРАЗ -->
  <section id="v-look">
    <h2>Куда собираешься</h2>
    <div class="chips" id="occ"></div>
    <h2 style="margin-top:16px">Что на улице</h2>
    <div class="chips" id="temp"></div>
    <div class="row"><button class="btn" id="make">Собрать образ</button></div>
    <div id="lookOut"></div>
  </section>

  <!-- ШКАФ -->
  <section id="v-closet" hidden>
    <h2>Что в шкафу</h2>
    <div class="chips" id="filter"></div>
    <div class="row">
      <label class="btn" style="text-align:center" tabindex="0">Добавить фото
        <input type="file" id="pick" accept="image/*" multiple hidden>
      </label>
    </div>
    <div class="grid" id="grid"></div>
    <p class="hint" id="closetHint"></p>
    <div id="demoBox" style="margin-top:10px"></div>
  </section>

  <!-- ДНИ -->
  <section id="v-days" hidden>
    <h2>Что носил</h2>
    <div id="days"></div>
  </section>
</div>

<nav>
  <button data-v="look" aria-current="page">Образ</button>
  <button data-v="closet">Шкаф</button>
  <button data-v="days">Дни</button>
</nav>

<script>
(function(){
"use strict";

/* ---------- хранилище ---------- */
var DB=null;
function db(){return new Promise(function(res,rej){
  if(DB) return res(DB);
  var r=indexedDB.open("wardrobe",1);
  r.onupgradeneeded=function(e){var d=e.target.result;
    if(!d.objectStoreNames.contains("items")) d.createObjectStore("items",{keyPath:"id"});
    if(!d.objectStoreNames.contains("wears")) d.createObjectStore("wears",{keyPath:"id"});};
  r.onsuccess=function(){DB=r.result;res(DB)};
  r.onerror=function(){rej(r.error)};});}
function tx(store,mode,fn){return db().then(function(d){return new Promise(function(res,rej){
  var t=d.transaction(store,mode),s=t.objectStore(store),out=fn(s);
  t.oncomplete=function(){res(out&&out.result!==undefined?out.result:out)};
  t.onerror=function(){rej(t.error)};});});}
var all=function(s){return tx(s,"readonly",function(o){return o.getAll()})};
var put=function(s,v){return tx(s,"readwrite",function(o){return o.put(v)})};
var del=function(s,k){return tx(s,"readwrite",function(o){return o.delete(k)})};

/* ---------- справочники ---------- */
var CATS=[["top","Верх"],["bottom","Низ"],["shoes","Обувь"],["outer","Верхняя"],["acc","Аксессуар"]];
var FORMAL=[["home","Дома"],["casual","Повседневное"],["smart","Наряднее"],["business","Деловое"]];
var SEASON=[["warm","Тепло"],["mid","Межсезонье"],["cold","Холод"],["all","Всесезон"]];
var OCC=[
 {k:"home",t:"Дома",f:["home","casual"]},
 {k:"walk",t:"Погулять",f:["casual","smart"]},
 {k:"work",t:"Деловая встреча",f:["business","smart"]},
 {k:"evening",t:"Вечер",f:["smart","business"]},
 {k:"sport",t:"Спорт",f:["home","casual"]}];
var TEMP=[
 {k:"hot",t:"Жарко",s:["warm","all"],outer:false},
 {k:"warm",t:"Тепло",s:["warm","mid","all"],outer:false},
 {k:"cool",t:"Прохладно",s:["mid","cold","all"],outer:true},
 {k:"cold",t:"Холодно",s:["cold","all"],outer:true}];
var label=function(list,k){for(var i=0;i<list.length;i++) if(list[i][0]===k) return list[i][1];return k;};

/* ---------- цвет ---------- */
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),h=0,s=0,l=(mx+mn)/2,d=mx-mn;
  if(d){s=l>.5?d/(2-mx-mn):d/(mx+mn);
    h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);h*=60;}
  return{h:h,s:s,l:l};}
function colorName(c){
  if(c.l<.13) return "чёрный";
  if(c.l>.88&&c.s<.16) return "белый";
  if(c.s<.14) return c.l<.42?"тёмно-серый":"серый";
  var h=c.h;
  if(h<18||h>=340) return c.l<.34?"бордовый":"красный";
  if(h<45) return c.s<.42?(c.l>.55?"песочный":"бежевый"):(c.l<.38?"коричневый":"оранжевый");
  if(h<68) return c.l<.42?"хаки":"жёлтый";
  if(h<160) return c.l<.36?"тёмно-зелёный":(c.s<.35?"оливковый":"зелёный");
  if(h<200) return "бирюзовый";
  if(h<250) return c.l<.34?"тёмно-синий":(c.s<.4?"джинсовый":"синий");
  if(h<290) return "фиолетовый";
  return "розовый";}
function isNeutral(c){
  if(c.s<.19||c.l<.16||c.l>.86) return true;
  if(c.h>=18&&c.h<48&&c.s<.4) return true;              /* бежевый, песочный */
  if(c.h>=200&&c.h<250&&c.l<.34) return true;           /* тёмно-синий */
  return false;}

/* ---------- обработка фото ---------- */
function readImage(file){return new Promise(function(res,rej){
  var fr=new FileReader();
  fr.onload=function(){var im=new Image();
    im.onload=function(){res(im)};im.onerror=rej;im.src=fr.result;};
  fr.onerror=rej;fr.readAsDataURL(file);});}
function process(im){
  var M=760,w=im.width,h=im.height,k=Math.min(1,M/Math.max(w,h));
  var c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);
  var x=c.getContext("2d");x.drawImage(im,0,0,c.width,c.height);
  var sx=Math.round(c.width*.28),sy=Math.round(c.height*.28),
      sw=Math.max(1,Math.round(c.width*.44)),sh=Math.max(1,Math.round(c.height*.44));
  var d=x.getImageData(sx,sy,sw,sh).data,r=0,g=0,b=0,n=0;
  for(var i=0;i<d.length;i+=16){r+=d[i];g+=d[i+1];b+=d[i+2];n++;}
  var col=rgb2hsl(r/n,g/n,b/n);
  return{img:c.toDataURL("image/jpeg",.74),
         color:{h:col.h,s:col.s,l:col.l,name:colorName(col),neutral:isNeutral(col),
                css:"hsl("+Math.round(col.h)+","+Math.round(col.s*100)+"%,"+Math.round(col.l*100)+"%)"}};}

/* ---------- демонстрационные вещи ---------- */
function svg(body,bg){return "data:image/svg+xml;utf8,"+encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160"><rect width="120" height="160" fill="'+bg+'"/>'+body+'</svg>');}
var DEMO=[
 {n:"Белая футболка",cat:"top",formal:"casual",season:"warm",c:"#EDEDEA",
  s:'<path d="M38 40l16-8h12l16 8 10 10-10 10-4-4v42H42V56l-4 4-10-10z" fill="#F7F7F5" stroke="#C9CCC6" stroke-width="2"/>'},
 {n:"Синяя рубашка",cat:"top",formal:"business",season:"mid",c:"#2E4C6B",
  s:'<path d="M38 40l16-8h12l16 8 10 10-10 10-4-4v42H42V56l-4 4-10-10z" fill="#2E4C6B"/><path d="M60 32v66" stroke="#1D3348" stroke-width="2"/>'},
 {n:"Тёмные джинсы",cat:"bottom",formal:"casual",season:"all",c:"#33465C",
  s:'<path d="M42 34h36v20l-4 66H62l-2-46-2 46H44l-2-66z" fill="#33465C"/>'},
 {n:"Серые брюки",cat:"bottom",formal:"business",season:"all",c:"#6E7378",
  s:'<path d="M42 34h36v20l-4 66H62l-2-46-2 46H44l-2-66z" fill="#767B80"/>'},
 {n:"Белые кроссовки",cat:"shoes",formal:"casual",season:"all",c:"#E8E8E4",
  s:'<path d="M26 96c14-6 22-16 30-24l14 6c6 10 18 14 26 16 6 2 8 6 8 10H26z" fill="#EFEFEC" stroke="#C9CCC6" stroke-width="2"/>'},
 {n:"Чёрные ботинки",cat:"shoes",formal:"business",season:"cold",c:"#232629",
  s:'<path d="M30 96c12-6 18-18 24-28l16 6c4 12 14 18 24 20 6 2 8 6 8 10H30z" fill="#24272A"/>'},
 {n:"Тёмная куртка",cat:"outer",formal:"casual",season:"cold",c:"#33383C",
  s:'<path d="M34 40l18-10h16l18 10 8 14-12 8v56H38V62l-12-8z" fill="#34393D"/><path d="M60 30v88" stroke="#22262A" stroke-width="2"/>'}];
function demoItems(){
  return DEMO.map(function(d,i){
    var c=(function(hex){var r=parseInt(hex.slice(1,3),16)||120,g=parseInt(hex.slice(3,5),16)||120,
        b=parseInt(hex.slice(5,7),16)||120,o=rgb2hsl(r,g,b);
      return{h:o.h,s:o.s,l:o.l,name:colorName(o),neutral:isNeutral(o),css:hex};})(d.c.slice(0,7));
    return{id:"demo-"+i,img:svg(d.s,"#EFF0ED"),cat:d.cat,formal:d.formal,season:d.season,
           name:d.n,color:c,demo:true,added:Date.now()+i};});}

/* ---------- состояние ---------- */
var items=[],wears=[],view="look",filter="all",
    occ=localStorage.getItem("occ")||"walk",
    temp=localStorage.getItem("temp")||"cool",
    current=null;

/* ---------- отрисовка ---------- */
var $=function(s){return document.querySelector(s)};
function chips(host,list,active,onPick){
  host.innerHTML="";
  list.forEach(function(o){
    var b=document.createElement("button");
    b.className="chip";b.type="button";b.textContent=o.t;
    b.setAttribute("aria-pressed",String(o.k===active));
    b.onclick=function(){onPick(o.k)};
    host.appendChild(b);});}

function renderHeader(){
  var real=items.filter(function(i){return !i.demo}).length;
  var d=items.length-real;
  $("#count").textContent=real+" "+plural(real,"вещь","вещи","вещей")+(d?" + "+d+" примеров":"");}
function plural(n,a,b,c){var m=n%100;if(m>=11&&m<=14)return c;m=n%10;
  return m===1?a:(m>=2&&m<=4?b:c);}

function renderLook(){
  chips($("#occ"),OCC.map(function(o){return{k:o.k,t:o.t}}),occ,function(k){
    occ=k;localStorage.setItem("occ",k);renderLook();});
  chips($("#temp"),TEMP.map(function(o){return{k:o.k,t:o.t}}),temp,function(k){
    temp=k;localStorage.setItem("temp",k);renderLook();});
  var out=$("#lookOut");out.innerHTML="";
  if(!current) return;
  if(current.error){
    var e=document.createElement("div");e.className="empty";e.textContent=current.error;
    out.appendChild(e);return;}
  var box=document.createElement("div");box.className="look";
  current.pieces.forEach(function(it){
    var p=document.createElement("div");p.className="piece";
    var im=document.createElement("img");im.src=it.img;im.alt="";
    var m=document.createElement("div");m.className="meta";
    m.innerHTML='<div class="role">'+label(CATS,it.cat)+'</div>'+
      '<div class="name"></div><div class="sub"><span class="sw"></span></div>';
    m.querySelector(".name").textContent=it.name||label(CATS,it.cat);
    m.querySelector(".sw").style.background=it.color.css;
    m.querySelector(".sub").appendChild(document.createTextNode(
      it.color.name+", "+label(FORMAL,it.formal).toLowerCase()));
    p.appendChild(im);p.appendChild(m);box.appendChild(p);});
  out.appendChild(box);
  if(current.note){var n=document.createElement("div");n.className="note";
    n.textContent=current.note;out.appendChild(n);}
  var row=document.createElement("div");row.className="row";
  var b1=document.createElement("button");b1.className="btn ghost";b1.textContent="Другой вариант";
  b1.onclick=build;
  var b2=document.createElement("button");b2.className="btn";b2.textContent="Надел сегодня";
  b2.onclick=wearToday;
  row.appendChild(b1);row.appendChild(b2);out.appendChild(row);}

function renderCloset(){
  var list=[{k:"all",t:"Всё"}].concat(CATS.map(function(c){return{k:c[0],t:c[1]}}));
  chips($("#filter"),list,filter,function(k){filter=k;renderCloset();});
  var g=$("#grid");g.innerHTML="";
  var vis=items.filter(function(i){return filter==="all"||i.cat===filter})
               .sort(function(a,b){return b.added-a.added});
  vis.forEach(function(it){
    var b=document.createElement("button");
    b.className="cell"+(it.demo?" is-demo":"");
    b.onclick=function(){openItem(it)};
    var im=document.createElement("img");im.src=it.img;im.alt=it.name||label(CATS,it.cat);
    var l=document.createElement("span");l.className="lbl";
    l.textContent=label(CATS,it.cat)+" · "+it.color.name;
    b.appendChild(im);b.appendChild(l);g.appendChild(b);});
  $("#closetHint").textContent = vis.length
    ? "Тап по вещи открывает карточку: там меняются метки и удаляется фото."
    : "Пусто. Нажми «Добавить фото»: можно выбрать сразу несколько.";
  var box=$("#demoBox");box.innerHTML="";
  if(items.some(function(i){return i.demo})){
    var b=document.createElement("button");
    b.className="btn ghost small";b.textContent="Убрать примеры";b.onclick=dropDemo;
    box.appendChild(b);}}

function renderDays(){
  var host=$("#days");host.innerHTML="";
  if(!wears.length){host.innerHTML='<div class="empty">Пока пусто. Собери образ и нажми «Надел сегодня», чтобы приложение не предлагало то же самое на днях.</div>';return;}
  wears.slice().sort(function(a,b){return b.id-a.id}).slice(0,40).forEach(function(w){
    var d=document.createElement("div");d.className="day";
    var dd=document.createElement("div");dd.className="d";dd.textContent=fmtDate(w.date);
    var th=document.createElement("div");th.className="th";
    w.items.forEach(function(id){var it=byId(id);if(!it)return;
      var im=document.createElement("img");im.src=it.img;im.alt="";th.appendChild(im);});
    var oc=document.createElement("div");oc.className="oc";oc.textContent=w.occ;
    d.appendChild(dd);d.appendChild(th);d.appendChild(oc);host.appendChild(d);});}
function fmtDate(s){var p=s.split("-");return p[2]+"."+p[1];}
function byId(id){for(var i=0;i<items.length;i++) if(items[i].id===id) return items[i];return null;}

/* ---------- подбор ---------- */
function recent(id){
  var lim=Date.now()-7*864e5,n=0;
  wears.forEach(function(w){
    if(new Date(w.date).getTime()>=lim && w.items.indexOf(id)>-1) n++;});
  return n;}
function build(){
  var o=OCC.filter(function(x){return x.k===occ})[0],
      t=TEMP.filter(function(x){return x.k===temp})[0];
  var pick=function(cat){
    return items.filter(function(i){
      return i.cat===cat && o.f.indexOf(i.formal)>-1 && t.s.indexOf(i.season)>-1;});};
  var need=["top","bottom","shoes"].concat(t.outer?["outer"]:[]);
  var pools={},missing=[];
  need.forEach(function(c){pools[c]=pick(c);if(!pools[c].length) missing.push(label(CATS,c).toLowerCase());});
  if(missing.length){
    current={error:"Не хватает вещей: "+missing.join(", ")+
      ". Добавь их в шкаф или сними лишние ограничения по поводу и погоде."};
    renderLook();return;}
  var best=null,bestScore=1e9;
  for(var k=0;k<220;k++){
    var set=need.map(function(c){var p=pools[c];return p[Math.floor(Math.random()*p.length)]});
    var bright=set.filter(function(i){return !i.color.neutral});
    var clash=false;
    if(bright.length>2) clash=true;
    else if(bright.length===2){
      var dh=Math.abs(bright[0].color.h-bright[1].color.h);dh=Math.min(dh,360-dh);
      if(dh>42) clash=true;}
    var score=set.reduce(function(a,i){return a+recent(i.id)*3},0)+(clash?40:0)+Math.random();
    if(score<bestScore){bestScore=score;best={pieces:set,clash:clash};}
    if(!clash&&bestScore<1) break;}
  current={pieces:best.pieces,
    note:best.clash?"Ярких вещей в наборе больше, чем стоит носить вместе. Другие сочетания из твоего шкафа под этот повод не нашлись.":""};
  renderLook();}

function wearToday(){
  if(!current||!current.pieces) return;
  var d=new Date(),date=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  var w={id:Date.now(),date:date,occ:OCC.filter(function(x){return x.k===occ})[0].t,
         items:current.pieces.map(function(i){return i.id})};
  wears.push(w);put("wears",w);
  go("days");}

/* ---------- карточка вещи ---------- */
function openItem(it){
  var sh=document.createElement("div");sh.className="sheet";
  var inner=document.createElement("div");inner.className="inner";
  inner.innerHTML='<h3>Карточка вещи</h3>';
  var im=document.createElement("img");im.className="preview";im.src=it.img;im.alt="";
  inner.appendChild(im);
  var nameF=document.createElement("div");nameF.className="field";
  nameF.innerHTML='<span>Название</span>';
  var inp=document.createElement("input");inp.type="text";inp.value=it.name||"";
  inp.placeholder="например, серый свитер";
  inp.style.cssText="width:100%;font:inherit;padding:10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)";
  nameF.appendChild(inp);inner.appendChild(nameF);
  var draft={cat:it.cat,formal:it.formal,season:it.season};
  [["Что это",CATS,"cat"],["Насколько нарядная",FORMAL,"formal"],["Сезон",SEASON,"season"]]
    .forEach(function(f){
      var d=document.createElement("div");d.className="field";
      d.innerHTML='<span>'+f[0]+'</span>';
      var c=document.createElement("div");c.className="chips";d.appendChild(c);
      var draw=function(){chips(c,f[1].map(function(x){return{k:x[0],t:x[1]}}),draft[f[2]],
        function(k){draft[f[2]]=k;draw();});};
      draw();inner.appendChild(d);});
  var row=document.createElement("div");row.className="row";
  var save=document.createElement("button");save.className="btn";save.textContent="Сохранить";
  save.onclick=function(){
    it.cat=draft.cat;it.formal=draft.formal;it.season=draft.season;it.name=inp.value.trim();
    if(it.demo){it.demo=false;}
    put("items",it).then(function(){close();renderAll();});};
  var cancel=document.createElement("button");cancel.className="btn ghost";cancel.textContent="Закрыть";
  cancel.onclick=function(){close()};
  row.appendChild(cancel);row.appendChild(save);inner.appendChild(row);
  var rm=document.createElement("button");rm.className="btn ghost danger";
  rm.style.marginTop="8px";rm.textContent="Удалить из шкафа";
  rm.onclick=function(){
    items=items.filter(function(x){return x.id!==it.id});
    del("items",it.id).then(function(){close();renderAll();});};
  inner.appendChild(rm);
  sh.appendChild(inner);document.body.appendChild(sh);
  sh.onclick=function(e){if(e.target===sh) close()};
  function close(){sh.remove()}}

/* ---------- добавление ---------- */
$("#pick").addEventListener("change",function(e){
  var files=Array.prototype.slice.call(e.target.files||[]);
  e.target.value="";
  if(!files.length) return;
  var hint=$("#closetHint");
  hint.textContent="Обрабатываю "+files.length+" "+plural(files.length,"фото","фото","фото")+"…";
  var added=[];
  files.reduce(function(chain,f){
    return chain.then(function(){
      return readImage(f).then(function(im){
        var r=process(im);
        var it={id:"i"+Date.now().toString(36)+Math.random().toString(36).slice(2,7),img:r.img,
                cat:guessCat(f.name),formal:"casual",season:"all",color:r.color,name:"",added:Date.now()};
        items.push(it);added.push(it);
        return put("items",it);
      }).catch(function(){});});
  },Promise.resolve()).then(function(){
    renderAll();
    if(added.length===1) openItem(added[0]);
    else hint.textContent="Добавлено "+added.length+". Открой каждую вещь и поставь метки: без них подбор работает вслепую.";});});

function guessCat(n){
  n=(n||"").toLowerCase();
  if(/shoe|boot|sneak|обув|ботин|кросс|туфл/.test(n)) return "shoes";
  if(/jean|pant|trous|брюк|джинс|штан|шорт/.test(n)) return "bottom";
  if(/coat|jack|курт|пальто|пуховик/.test(n)) return "outer";
  return "top";}

function dropDemo(){
  var demo=items.filter(function(i){return i.demo});
  items=items.filter(function(i){return !i.demo});
  Promise.all(demo.map(function(i){return del("items",i.id)})).then(function(){
    current=null;renderAll();});}

/* ---------- навигация ---------- */
function go(v){
  view=v;
  ["look","closet","days"].forEach(function(x){$("#v-"+x).hidden=(x!==v);});
  Array.prototype.forEach.call(document.querySelectorAll("nav button"),function(b){
    if(b.dataset.v===v) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");});
  renderAll();
  window.scrollTo(0,0);}
Array.prototype.forEach.call(document.querySelectorAll("nav button"),function(b){
  b.onclick=function(){go(b.dataset.v)};});
$("#make").onclick=build;
document.querySelector('label[tabindex]').addEventListener("keydown",function(e){
  if(e.key==="Enter"||e.key===" "){e.preventDefault();$("#pick").click();}});

function renderAll(){renderHeader();
  if(view==="look") renderLook(); else if(view==="closet") renderCloset(); else renderDays();}

/* ---------- старт ---------- */
Promise.all([all("items"),all("wears")]).then(function(r){
  items=r[0]||[];wears=r[1]||[];
  if(!items.length){
    items=demoItems();
    return Promise.all(items.map(function(i){return put("items",i)}));}
}).catch(function(){items=demoItems();})
  .then(function(){build();go("look");});
})();
</script>
